name: Check and publish Atlas

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TYPESAFE_API_KEY: ''

jobs:
  checks:
    name: Check on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check the application version
        run: npm run check:version
      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ATLAS_VERSION_TAG: ${{ github.ref_name }}
        run: npm run check:version -- --tag "$ATLAS_VERSION_TAG"
      - name: Check the generated guides
        run: npm run check:docs
      - name: Check catalogue records and generated views
        run: npm run check:catalogue
      - name: Run unit and integration checks
        run: npm test

  browser-and-build:
    name: Check the browser and public bundle
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chrome and its system dependencies
        run: npx --no-install playwright install --with-deps chrome
      - name: Check suggestions and exported artifacts
        run: npm run test:browser
      - name: Check project handoffs and reopening
        run: npm run test:handoff
      - name: Check catalogue navigation and offline reading
        run: npm run test:catalogue-browser
      - name: Check the static site under the Pages path
        run: npm run test:static-browser
      - name: Build the public files
        id: public
        run: npm run build:static
      - name: Keep the public bundle for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-atlas-public-${{ github.sha }}
          path: ${{ steps.public.outputs.path }}/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Prepare the checked site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'ai21z/workflow-atlas'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ steps.public.outputs.path }}
      - name: Keep browser check results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-atlas-browser-${{ github.sha }}
          path: |
            local-knowledge/retests/jev-integration/**/*.json
            local-knowledge/retests/jev-integration/**/*.png
            local-knowledge/retests/artifact-beta/**/*.json
            local-knowledge/retests/artifact-beta/**/*.png
            local-knowledge/retests/output-choice/**/*.json
            local-knowledge/retests/output-choice/**/*.png
            local-knowledge/retests/output-transitions/**/*.json
            local-knowledge/retests/output-transitions/**/*.png
            local-knowledge/retests/handoff-ux/**/*.json
            local-knowledge/retests/handoff-ux/**/*.png
            local-knowledge/retests/import-recovery/**/*.json
            local-knowledge/retests/import-recovery/**/*.png
            local-knowledge/retests/navigation-recovery/**/*.json
            local-knowledge/retests/navigation-recovery/**/*.png
            local-knowledge/reviews/process-designer/**/*.json
            local-knowledge/reviews/process-designer/**/*.png
            local-knowledge/retests/static-pages/**/*.json
            local-knowledge/retests/static-pages/**/*.png
            exports/browser-qa-catalogue/*.png
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

  deploy-pages:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'ai21z/workflow-atlas'
    needs: browser-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish the checked static bundle
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
